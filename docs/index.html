  saving = slot;
  flash(slot, 'saving…');
  renderDash();
  try {
    await write(OP_FAN_SOURCE, slot, kind, h.kind === 'gpio' ? h.gpio : NONE, pts.length / 2, ...pts);
    if (!saChr) { saving = null; delete edits[slot]; flash(slot, 'stored on the receiver', 'ok'); renderDash(); return; }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      if (saving !== slot) return;
      saving = null;
      flash(slot, 'the receiver did not echo the change', 'err');
      renderDash();
    }, SAVE_TIMEOUT_MS);
  } catch {
    saving = null;
    flash(slot, 'refused by the receiver — a pin it can’t read on, or a bad curve', 'err'); // write() said more
    renderDash();
  }
}

function saveEdit(slot) {
  const h = edits[slot];
  if (!h) return;
  h.pts.sort((a, b) => a.x - b.x);
  const bad = checkEdit(h);
  if (bad) { flash(slot, bad, 'err'); return; }
  if (h.route !== 'daemon') { writeSource(slot, h); return; }
  if (!cfg) return;
  const e = { s: srcText(h), b: h.boost === NONE ? null : h.boost, n: h.name.trim() };
  if (!isFixed(h)) e.c = curveText(h.pts);
  writeCfg(slot, { ['header' + (slot + 1)]: e });
}

// ---- the global card: hysteresis, ramp, boost seconds ----
function renderGlobals() {
  const card = $('globals');
  const editable = !!(cfg && cfg.editable);
  card.hidden = !cfg;
  if (card.hidden) return;
  const g = edits.g || cfg;
  const set = (inp, v) => { if (document.activeElement !== inp && inp.value !== String(v)) inp.value = v; };
  set($('g-hyst'), g.hyst); set($('g-ramp'), g.ramp); set($('g-boost'), g.boostSecs);
  for (const id of ['g-hyst', 'g-ramp', 'g-boost']) $(id).disabled = !editable || saving !== null;
  $('g-save').hidden = $('g-revert').hidden = !('g' in edits);
  $('g-save').disabled = saving !== null;
}
for (const [id, key] of [['g-hyst', 'hyst'], ['g-ramp', 'ramp'], ['g-boost', 'boostSecs']])
  $(id).addEventListener('input', e => {
    if (!cfg) return;
    edits.g ||= { hyst: cfg.hyst, ramp: cfg.ramp, boostSecs: cfg.boostSecs };
    const v = parseFloat(e.target.value);
    if (!isNaN(v)) edits.g[key] = key === 'boostSecs' ? Math.max(0, Math.min(255, Math.round(v))) : Math.max(0, v);
    renderGlobals();
  });
$('g-revert').addEventListener('click', () => { delete edits.g; renderDash(); });
$('g-save').addEventListener('click', () => {
  if (!edits.g || !cfg) return;
  writeCfg('g', { hysteresis: edits.g.hyst, ramp: edits.g.ramp, boost_seconds: edits.g.boostSecs });
});

// ---- the strip card ----
// The daemon's strip view (daemon/strip_remote.hpp): the strip block's knobs
// and the scenes. Unlike the fan editor there is no Save: a slider applies
// on release, a switch on the tap — the daemon corrects the live strip at
// once and writes the value into its config, and the answering config is
// what says "saved". Edits that land while one is in flight are merged and
// sent when the answer comes, so dragging a second slider never fails.
let scfg = null;        // the parsed view
let sSaving = false;    // a write waiting for the daemon's view to come back
let sInflight = null;   // that write's edit — the answer must reflect it
let sPending = null;    // edits merged while sSaving
let sTimer = 0;
const hex2 = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');

function parseStripCfg(text) {
  let j;
  try { j = JSON.parse(text); } catch { return null; }
  if (!j || typeof j !== 'object') return null;
  const g = String(j.gamma ?? '2.2').trim().split(/\s+/).map(parseFloat).filter(x => !isNaN(x));
  const gamma = g.length === 3 ? g : [g[0] ?? 2.2, g[0] ?? 2.2, g[0] ?? 2.2];
  const w = String(j.white_balance ?? 'ffffff').replace('#', '').padStart(6, 'f');
  const wb = [0, 2, 4].map(i => parseInt(w.substr(i, 2), 16) || 0);
  return { editable: !!j.editable, leds: +j.leds || 0, pin: +j.pin || 0, reverse: !!j.reverse,
           brightness: Math.max(0, Math.min(1, +j.brightness || 0)), gamma, wb,
           scenes: Array.isArray(j.scenes) ? j.scenes.filter(s => s && typeof s.p === 'string').map(s => ({
             p: s.p, e: String(s.e || ''), on: !!s.on,
             color: typeof s.color === 'string' ? s.color.replace('#', '') : null,
             l: typeof s.l === 'number' ? s.l : null })) : [] };
}

function stripReset() {
  scfg = null; sSaving = false; sInflight = null; sPending = null;
  clearTimeout(sTimer);
  $('stripcard').hidden = true;
  $('scenes').dataset.sig = '';
}

const onStripEvent = jsonNotifier(() => stripChr, onStripCfg);

// does the daemon's view carry the edit? The view is also pushed unsolicited
// (a scene's file appearing or disappearing), so an answer is recognised by
// its content, not its arrival; a refused edit sends nothing and times out.
const near = (a, b) => Math.abs(a - b) < 0.006;
function reflects(v, edit) {
  if ('brightness' in edit && !near(v.brightness, edit.brightness)) return false;
  if ('reverse' in edit && v.reverse !== edit.reverse) return false;
  if ('white_balance' in edit && v.wb.map(hex2).join('') !== edit.white_balance.toLowerCase()) return false;
  if ('gamma' in edit) {
    const g = String(edit.gamma).split(/\s+/).map(parseFloat);
    const want = g.length === 3 ? g : [g[0], g[0], g[0]];
    if (!want.every((x, i) => near(x, v.gamma[i]))) return false;
  }
  for (const e of edit.scenes || []) {
    const s = v.scenes.find(x => x.p === e.p);
    if (!s) return false;
    if ('on' in e && s.on !== e.on) return false;
    if ('color' in e && s.color !== e.color.toLowerCase()) return false;
    if ('l' in e && !near(s.l, e.l)) return false;
  }
  return true;
}

function onStripCfg(dv) {
  scfg = dv.byteLength ? parseStripCfg(utf8.decode(dv)) : null;
  if (sSaving && scfg && reflects(scfg, sInflight)) {
    sSaving = false; sInflight = null;
    clearTimeout(sTimer);
    sflash('saved', 'ok');
    if (sPending) { const e = sPending; sPending = null; writeStrip(e); }
  }
  renderStrip();
}

async function stripOpen(sc) {
  stripChr = sc;
  sc.addEventListener('characteristicvaluechanged', onStripEvent);
  await gattSubscribe(sc);
  const v = await gattRead(sc);
  if (stripChr !== sc) return;
  onStripCfg(v);
}

function sflash(text, cls) {
  const el = $('s-msg');
  el.textContent = text;
  el.className = 'msg ' + (cls || '');
  if (cls === 'ok') setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 2500);
}

// merge a partial edit into another (scenes by path)
function mergeStrip(into, edit) {
  for (const k in edit) {
    if (k !== 'scenes') { into[k] = edit[k]; continue; }
    into.scenes ||= [];
    for (const s of edit.scenes) {
      const have = into.scenes.find(x => x.p === s.p);
      if (have) Object.assign(have, s); else into.scenes.push({ ...s });
    }
  }
  return into;
}

async function writeStrip(edit) {
  if (!stripChr || !scfg || !scfg.editable) return;
  if (sSaving) { sPending = mergeStrip(sPending || {}, edit); return; }
  const text = new TextEncoder().encode(JSON.stringify(edit));
  const buf = new Uint8Array(TOKEN_LEN + text.length);
  buf.set(tokenBytes()); buf.set(text, TOKEN_LEN);
  sSaving = true; sInflight = edit;
  sflash('saving…');
  try {
    await gattWrite(stripChr, buf);
    clearTimeout(sTimer);
    sTimer = setTimeout(() => {
      if (!sSaving) return;
      sSaving = false; sInflight = null; sPending = null;
      sflash('no answer from the daemon — is it running, and can it write its config?', 'err');
      renderStrip();
    }, SAVE_TIMEOUT_MS);
  } catch (e) {
    sSaving = false; sInflight = null; sPending = null;
    if (tokenRejected(e)) { sflash('token rejected', 'err'); editToken = true; render(); }
    else sflash(`write failed: ${e.message}${writeHint(e)}`, 'err');
    renderStrip();
  }
}

// a slider being dragged, a field being typed in, or a value whose edit is
// still in flight is not overwritten by an incoming view; everything else
// follows the daemon. (A switch or color well keeps focus after a tap and
// isn't "being edited", so only typed and dragged inputs get the focus test.)
const sliding = new Set();
function setIf(inp, v) {
  const typing = inp.type === 'text' || inp.type === 'number' || inp.type === 'range';
  if ((typing && document.activeElement === inp) || sliding.has(inp)) return;
  if (inp.type === 'checkbox') { if (inp.checked !== !!v) inp.checked = !!v; }
  else if (inp.value !== String(v)) inp.value = v;
}
// the edits the daemon hasn't answered yet, merged — their fields hold
const pendingStrip = () => mergeStrip(mergeStrip({}, sInflight || {}), sPending || {});

function renderStrip() {
  const card = $('stripcard');
  card.hidden = !scfg;
  if (!scfg) return;
  const ro = !scfg.editable;
  $('stripnote').textContent = `${scfg.leds} LEDs on GPIO${scfg.pin}`;
  $('s-ro').hidden = !ro;
  for (const id of ['s-bri', 's-wr', 's-wg', 's-wb', 's-gr', 's-gg', 's-gb', 's-rev']) $(id).disabled = ro;

  const pend = pendingStrip();
  if (!('brightness' in pend)) setIf($('s-bri'), Math.round(scfg.brightness * 100));
  $('s-bri-v').textContent = `${$('s-bri').value} %`;
  [['s-wr', 0], ['s-wg', 1], ['s-wb', 2]].forEach(([id, i]) => {
    if (!('white_balance' in pend)) setIf($(id), scfg.wb[i]);
    $(id + '-v').textContent = hex2(+$(id).value);
  });
  if (!('gamma' in pend)) [['s-gr', 0], ['s-gg', 1], ['s-gb', 2]].forEach(([id, i]) => setIf($(id), scfg.gamma[i]));
  if (!('reverse' in pend)) setIf($('s-rev'), scfg.reverse);

  // the scenes: rebuilt only when the list itself changes, else refreshed
  const wrap = $('scenes');
  const sig = JSON.stringify(scfg.scenes.map(s => [s.p, s.e, s.color !== null, s.l !== null]));
  if (wrap.dataset.sig !== sig) {
    wrap.dataset.sig = sig;
    wrap.replaceChildren();
    if (scfg.scenes.length) {
      const h = document.createElement('h3'); h.textContent = 'Scenes'; wrap.appendChild(h);
    }
    scfg.scenes.forEach((sc, i) => {
      const row = document.createElement('div');
      row.className = 'scene';
      row.dataset.i = i;
      row.innerHTML = `<label class="sw"><input type="checkbox" class="on"><i></i></label>
        <div><div class="sname"></div><div class="spath"></div></div>
        ${sc.color !== null ? '<input type="color" class="col" aria-label="Scene color">' : '<span></span>'}
        ${sc.l !== null ? '<div class="extra"><div class="sl one"><input type="range" class="lvl" min="0" max="100" step="1" aria-label="Scene level"><span class="val"></span></div><span class="unit">level</span></div>' : ''}`;
      row.querySelector('.sname').textContent = sc.e;
      row.querySelector('.spath').textContent = sc.p;
      row.querySelector('.on').addEventListener('change', e => writeStrip({ scenes: [{ p: sc.p, on: e.target.checked }] }));
      const col = row.querySelector('.col');
      if (col) col.addEventListener('change', e => writeStrip({ scenes: [{ p: sc.p, color: e.target.value.replace('#', '') }] }));
      const lvl = row.querySelector('.lvl');
      if (lvl) bindSlider(lvl, v => { row.querySelector('.extra .val').textContent = `${v} %`; },
                          v => writeStrip({ scenes: [{ p: sc.p, l: v / 100 }] }));
      wrap.appendChild(row);
    });
  }
  scfg.scenes.forEach((sc, i) => {
    const row = wrap.querySelector(`.scene[data-i="${i}"]`);
    if (!row) return;
    const pe = (pend.scenes || []).find(x => x.p === sc.p) || {};
    const on = row.querySelector('.on'); if (!('on' in pe)) setIf(on, sc.on); on.disabled = ro;
    const col = row.querySelector('.col');
    if (col) { if (!('color' in pe)) setIf(col, '#' + sc.color); col.disabled = ro; }
    const lvl = row.querySelector('.lvl');
    if (lvl) { if (!('l' in pe)) setIf(lvl, Math.round(sc.l * 100)); lvl.disabled = ro; row.querySelector('.extra .val').textContent = `${lvl.value} %`; }
  });
}

// a range input: live() on every move (labels), done() once on release
function bindSlider(inp, live, done) {
  inp.addEventListener('pointerdown', () => sliding.add(inp));
  inp.addEventListener('input', () => live(+inp.value));
  inp.addEventListener('change', () => { sliding.delete(inp); live(+inp.value); done(+inp.value); });
  inp.addEventListener('pointerup', () => sliding.delete(inp));
  inp.addEventListener('pointercancel', () => { sliding.delete(inp); renderStrip(); });
}

bindSlider($('s-bri'), v => { $('s-bri-v').textContent = `${v} %`; }, v => writeStrip({ brightness: v / 100 }));
for (const id of ['s-wr', 's-wg', 's-wb'])
  bindSlider($(id), v => { $(id + '-v').textContent = hex2(v); },
             () => writeStrip({ white_balance: hex2(+$('s-wr').value) + hex2(+$('s-wg').value) + hex2(+$('s-wb').value) }));
for (const id of ['s-gr', 's-gg', 's-gb'])
  $(id).addEventListener('change', () => {
    const g = ['s-gr', 's-gg', 's-gb'].map(k => parseFloat($(k).value));
    if (g.some(x => !(x >= 0.5 && x <= 5))) { sflash('gamma is 0.5–5 per channel', 'err'); return; }
    writeStrip({ gamma: g.every(x => x === g[0]) ? String(g[0]) : g.join(' ') });
  });
$('s-rev').addEventListener('change', e => writeStrip({ reverse: e.target.checked }));

// ---- wiring ----
picker.addEventListener('change', async () => {
  const id = picker.value;
  if (busy) { picker.dataset.sig = ''; render(); return; } // never yank a board mid-write
  if (id !== ADD && known.has(id)) { select(id); render(); return; }
  busy = true; say(''); render();
  try { await pick(); }
  catch (e) {
    if (e.name !== 'NotFoundError') // chooser dismissed = not an error worth shouting
      say(`Couldn’t connect: ${e.message}`);
  } finally {
    busy = false;
    picker.dataset.sig = ''; // the selection may have gone nowhere: redraw
    render();
  }
});

powerBtn.addEventListener('click', async () => {
  if (busy) return;
  busy = true; say(''); render();
  if (device && device.gatt.connected) {
    if (psu === 0) try { await write(OP_ON); } catch {} // write() already said why
  } else {
    try { await pick(); }
    catch (e) {
      if (e.name !== 'NotFoundError') // chooser dismissed = not an error worth shouting
        say(`Couldn’t connect: ${e.message}`);
    }
  }
  busy = false; render();
});

shutdownBtn.addEventListener('click', async () => {
  if (busy || !confirm(`Ask ${label(device.id)} to shut down?`)) return;
  busy = true; render();
  try { await write(OP_SHUTDOWN); }
  catch {} finally { busy = false; render(); }
});

hardoffBtn.addEventListener('click', async () => {
  // the remote form of holding the physical button: an immediate PSU cut,
  // no graceful anything — for a crashed machine. Hence the louder confirm.
  if (busy || !confirm(`FORCE ${label(device.id)} off?\n\nThis cuts the PSU like ` +
                       'holding the button — unsaved work is lost. ' +
                       'For a machine that is wedged, not a normal shutdown.')) return;
  busy = true; render();
  try { await write(OP_HARD_OFF); }
  catch {} finally { busy = false; render(); }
});

$('savetoken').addEventListener('click', () => {
  const v = $('token').value.trim();
  if (v.length < 8) { say('The token is 8–16 characters.'); return; }
  // the selected board gets it; it also becomes the shared default when
  // there is none yet (first run) — the token boards without their own try
  if (device) { receivers[device.id].token = v; saveReceivers(); }
  if (!device || !store.get('ble-token')) store.set('ble-token', v);
  $('token').value = '';
  editToken = false;
  say('');
  render();
  resume();
});

$('canceltoken').addEventListener('click', () => {
  $('token').value = '';
  editToken = false;
  say('');
  render();
});

tokenBtn.addEventListener('click', () => { editToken = true; render(); });

forgetBtn.addEventListener('click', async () => {
  if (busy || !device) return;
  const d = device;
  if (!confirm(`Forget ${label(d.id)}?\n\nIts token and permission go; the chooser adds it back.`))
    return;
  clearTimeout(retryTimer);
  watchAbort?.abort();
  if (d.gatt.connected) d.gatt.disconnect();
  device = null; ctrl = stat = null; psu = -1; editToken = false;
  dashReset();
  delete receivers[d.id];
  known.delete(d.id);
  saveReceivers();
  if (store.get('ble-current') === d.id) store.set('ble-current', '');
  try { await d.forget?.(); } catch {} // Chrome ≥110 revokes the grant too
  say('');
  render();
  resume(); // falls over to the next known board, if any
});

document.addEventListener('visibilitychange', () => {
  // Chrome silently stops background scans: abort ours so the attempt
  // settles cleanly, and start a fresh one when the tab returns
  if (document.visibilityState === 'visible') resume();
  else watchAbort?.abort();
});

// ?demo: the dashboard on sample data, no receiver needed — to see the layout
// on a desktop, or to try the curve editor before wiring anything. Saves land
// locally after a moment, the way a daemon round trip would.
function demo() {
  cfg = parseCfg(JSON.stringify({ editable: true, hysteresis: 3, ramp: 5, boost_seconds: 5,
    header1: { n: 'pump', s: 'fallback', b: 100, f: 65 },
    header2: { n: 'radiator', s: 'temp', c: '45:35 60:55 75:100', b: null, f: 100 },
    header3: { n: 'exhaust', s: 'gpio:0', c: '0:25 100:80', b: null, f: 100 },
    header4: { n: 'intake', s: 'gpu_load', c: '0:20 40:20 100:60', b: null, f: 60 } }));
  scfg = parseStripCfg(JSON.stringify({ editable: true, leds: 33, pin: 4, reverse: false, brightness: 1,
    gamma: '2.2', white_balance: 'ffb0f0', scenes: [
      { p: '/tmp/led-static-color', e: 'solid', on: false, color: 'ffffff', l: 1 },
      { p: '/tmp/led-night', e: 'drift', on: false } ] }));
  telem = parseTelem(JSON.stringify({ temp: 58.3, cpu: 37, gpu: 62,
    header2: { in: 58.3, duty: 52 }, header4: { in: 62, duty: 45 } }));
  // the receiver's stored standalone settings: the config's, as the daemon
  // pushes them (header6 is wired but not in the daemon's config — dropped
  // from the file after flashing — and was dialled from the phone)
  const saBytes = new Uint8Array(SA_LEN);
  saBytes[0] = 5; saBytes[SA_V1_LEN] = 5;
  [[65, 100, 'fallback', NONE, []], [100, NONE, 'host', NONE, []], [100, NONE, 'gpio', 0, [[0, 25], [100, 80]]],
   [60, NONE, 'host', NONE, []], [NONE, NONE, 'host', NONE, []], [40, NONE, 'gpio', 20, [[0, 30], [100, 100]]]]
    .forEach(([fb, b, k, g, pts], i) => {
      saBytes[1 + 2 * i] = fb; saBytes[2 + 2 * i] = b;
      const q = SA_V1_LEN + 1 + i * SA_PER_HEADER;
      saBytes[q] = KIND_BYTE[k]; saBytes[q + 1] = g; saBytes[q + 2] = pts.length;
      pts.forEach(([x, y], j) => { saBytes[q + 3 + 2 * j] = x; saBytes[q + 4 + 2 * j] = y; });
    });
  sa = parseSa(new DataView(saBytes.buffer));
  const f = new Uint8Array(FANS_LEN(3)), dv = new DataView(f.buffer);
  f[0] = 3; f[1] = 0x01 | 0x08 | 0x10 | 0x20; f[2] = 2; f[3] = 1;
  // state: wired | src<<1 (1 = fallback, 2 = live, 4 = the receiver's own curve);
  // duty; the stored fallback; the source kind; a gpio header's reading
  [[0x03, 65, 100, 0, NONE], [0x05, 52, 100, 2, NONE], [0x09, 61, 100, 1, 65], [0x05, 45, 60, 2, NONE],
   [0, NONE, NONE, NONE, NONE], [0x09, 58, 40, 1, 40]]
    .forEach(([st, d, fb, k, inp], i) => { f.set([st, d, fb, k, inp], 4 + i * 5); });
  dv.setUint32(4 + CHANNELS * 5, 5 * 3600 + 17 * 60, true);
  fans = parseFans(dv);
  // ?demo&nodaemon: the same board with the machine off — no daemon config or
  // readings; every header on its fallback but the gpio ones, which the
  // receiver keeps on their curves; a slider on each card, and the source
  // picker offers what the receiver runs alone
  if (location.search.includes('nodaemon')) {
    cfg = telem = null;
    fans.live = fans.telem = fans.host = false; fans.age = 255; fans.psu = 0;
    fans.h.forEach(h => { if (h.wired && h.src !== 4) { h.src = 1; h.duty = h.fb; } });
  }
  info = { version: 'v1.23.0-demo', heap: 143 * 1024, minHeap: 121 * 1024 };
  psu = 2;
  // stand-ins for the GATT objects so the page believes it is connected
  device = { id: 'demo', gatt: { connected: true } };
  receivers.demo = { name: 'BC250 (demo)', token: 'demo-token' };
  fansChr = telemChr = saChr = {};
  ctrl = { writeValueWithResponse: async buf => {
    // the fan ops, applied the way the receiver would; the views echoing them
    // stand in for the next notifications
    const op = buf[TOKEN_LEN], slot = buf[TOKEN_LEN + 1], h = fans.h[slot], st = sa.h[slot];
    if (op === OP_FAN_FALLBACK) {
      h.fb = st.fb = buf[TOKEN_LEN + 2];
      if (h.src === 1) h.duty = h.fb;
      setTimeout(renderDash, 400);
    } else if (op === OP_FAN_SOURCE) {
      const kind = buf[TOKEN_LEN + 2], gpio = buf[TOKEN_LEN + 3], n = buf[TOKEN_LEN + 4];
      if (kind === KIND_BYTE.gpio && (gpio === 4 || gpio === 9 || gpio > 21)) throw new Error('GATT operation failed'); // a pin the receiver refuses
      st.kind = kind === KIND_BYTE.gpio ? 'gpio' : 'fallback'; st.gpio = gpio; st.pts = [];
      for (let j = 0; j < n; j++) st.pts.push({ x: buf[TOKEN_LEN + 5 + 2 * j], y: buf[TOKEN_LEN + 6 + 2 * j] });
      h.kind = kind;
      if (st.kind === 'gpio') { h.in = 50; h.src = 4; h.duty = Math.round(evalCurve(st, 50)); }
      else { h.in = NONE; h.src = 1; h.duty = h.fb; }
      const q = SA_V1_LEN + 1 + slot * SA_PER_HEADER; // the stored value, as the receiver would echo it
      saBytes.fill(0, q, q + SA_PER_HEADER);
      saBytes[q] = kind; saBytes[q + 1] = gpio; saBytes[q + 2] = n;
      saBytes.set(buf.subarray(TOKEN_LEN + 5, TOKEN_LEN + 5 + 2 * n), q + 3);
      setTimeout(() => onSa(new DataView(saBytes.buffer)), 400);
    } } };
  cfgChr = { writeValueWithResponse: async buf => {
    // merge the partial edit the way the daemon would
    const edit = JSON.parse(utf8.decode(buf.subarray(TOKEN_LEN)));
    const cur = cfg, out = { editable: true, hysteresis: edit.hysteresis ?? cur.hyst, ramp: edit.ramp ?? cur.ramp,
                             boost_seconds: edit.boost_seconds ?? cur.boostSecs };
    cur.h.forEach((h, i) => { if (!h) return; const k = 'header' + (i + 1), e = edit[k] || {};
      const s = srcInfo(e.s ?? h.src);
      out[k] = { n: e.n ?? h.name, s: s.src, b: 'b' in e ? e.b : (h.boost === NONE ? null : h.boost), f: e.f ?? h.fallback };
      if (s.kind !== 'fallback') out[k].c = e.c ?? curveText(h.pts); });
    // ...and push the standalone values to the receiver, as the daemon does
    cur.h.forEach((h, i) => { const e = edit['header' + (i + 1)]; const f = fans.h[i];
      if (e && 'f' in e && f.wired) { f.fb = e.f; if (f.src === 1) f.duty = e.f; } });
    setTimeout(() => onCfg(new DataView(new TextEncoder().encode(JSON.stringify(out)).buffer)), 600); } };
  stripChr = { writeValueWithResponse: async buf => {
    // apply the partial edit the way the daemon would, scenes by path
    const edit = JSON.parse(utf8.decode(buf.subarray(TOKEN_LEN)));
    const out = { editable: true, leds: scfg.leds, pin: scfg.pin, reverse: edit.reverse ?? scfg.reverse,
                  brightness: edit.brightness ?? scfg.brightness,
                  gamma: edit.gamma ?? (scfg.gamma.every(x => x === scfg.gamma[0]) ? String(scfg.gamma[0]) : scfg.gamma.join(' ')),
                  white_balance: edit.white_balance ?? scfg.wb.map(hex2).join(''),
                  scenes: scfg.scenes.map(s => { const e = (edit.scenes || []).find(x => x.p === s.p) || {};
                    const o = { p: s.p, e: s.e, on: e.on ?? s.on };
                    if (s.color !== null) o.color = e.color ?? s.color;
                    if (s.l !== null) o.l = e.l ?? s.l;
                    return o; }) };
    setTimeout(() => onStripCfg(new DataView(new TextEncoder().encode(JSON.stringify(out)).buffer)), 600); } };
  powerBtn.disabled = true;
  render();
  renderDash();
  renderStrip();
  if (location.search.includes('edit')) beginEdit(1);
  say('Demo data — not connected to a receiver.', true);
}

if (location.search.includes('demo'))
  demo();
else if (!('bluetooth' in navigator))
  say(IOS
    ? 'Safari has no Web Bluetooth. Open this page in ' +
      `<a href="${bluefyLink()}">Bluefy</a>, a free browser that has it ` +
      `(<a href="${BLUEFY_STORE}">App Store</a>), and bookmark it there.`
    : 'No Web Bluetooth here — use Chrome or Edge.');
else
  resume();

if ('serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(() => {});

render();
</script>
