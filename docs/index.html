<!doctype html>
<!-- BLE power remote and dashboard for the BC-250 receiver (firmware/main/ble.cpp).

     A single-file Web Bluetooth client: connect to a receiver's GATT
     service, show the PSU state, and send the commands the firmware
     accepts, each prefixed with the shared token written at flash time
     (the config's ble_remote.token, baked by make flash).

     The ring button IS the power remote: its color is the PSU state, its
     label the one action a tap performs. Text below it only appears for
     errors.

     Below the ring, once connected, the dashboard: the daemon's readings
     (CPU temperature and load, GPU load), one card per fan header — the
     duty the receiver applies and where it came from (boost / the daemon's
     curve / fallback), the curve's own input, and the curve itself, with the
     current operating point marked — and the receiver's build facts. Curves
     are editable in place: drag the points (or type them), set boost and
     fallback, save; the write goes to the receiver, which relays it to the
     daemon, which validates and applies it, writes it into its config file
     and pushes the config back — the page shows "saved" only when that
     round trip lands. Names, sources and which headers are enabled stay
     the config file's.

     Any number of receivers: every board the chooser has ever granted is
     listed in the dropdown above the ring (by its advertised name — the
     config's ble_remote.name), and
     the page holds ONE live connection — the selected board's. Switching
     drops that connection and runs the reconnect dance on the new pick.
     Tokens are kept per board (each is flashed with its own); a board with
     no token of its own tries the first token ever entered, and a rejected
     write opens the token box for that board.

     Reconnects on its own: the chooser grants a persistent permission, so
     navigator.bluetooth.getDevices() can hand the devices back on the next
     visit. Chrome refuses to gatt.connect() a device it hasn't seen this
     session, so the page first calls watchAdvertisements() and waits for
     one advertisement (the receiver advertises in both PSU states, see
     ble.cpp) before connecting — the sequence Chrome's own sample uses.
     The chooser is only ever needed once per board per phone.

     CAVEAT: as of 2026, auto-reconnect needs TWO chrome://flags (desktop
     AND Android): #enable-experimental-web-platform-features unlocks the
     getDevices()/watchAdvertisements() APIs, and — separately —
     #enable-web-bluetooth-new-permissions-backend makes the chooser grant
     persist across sessions. With only the first flag, getDevices() exists
     but returns [] on the next visit (the grant died with the session), so
     the page names the missing flag instead of degrading silently. Without
     either, tap-to-connect always works, and picking a board from the
     dropdown opens the chooser instead of connecting straight to it.

     Web Bluetooth needs Chrome or Edge — on Android or desktop — and HTTPS
     (GitHub Pages qualifies). iOS browsers don't have it. Installed from
     Chrome's "Add to Home screen", the service worker (sw.js) makes it work
     fully offline, which is the point: the machine travels.

     Everything protocol-shaped must match ble.cpp (JSON shapes: daemon/fans.hpp):
       service a5f20001-8f11-4e0e-9b3a-0bc250e0c001
       control a5f20002-... : write  token(16, NUL-padded) + op(1)
                              op 0x01=on 0x02=graceful shutdown 0x03=hard off
       status  a5f20003-... : read/notify  1 byte  0=off 1=booting 2=on
       fans    a5f20004-... : read/notify  the receiver's own fan view (parseFans)
       fancfg  a5f20005-... : read/notify  the daemon's fan config, JSON text
                              (daemon/fans.hpp documents the shape);
                              write  token(16) + a partial edit, same shape
       info    a5f20006-... : read  firmware version + heap (parseInfo)
       telem   a5f20007-... : read/notify  the daemon's readings, JSON text
     A receiver on older firmware has only the first two; the dashboard then
     stays hidden and the power remote works as before. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0e14">
<title>BC-250</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0b0e14;
    --panel: #141926;
    --text: #d7dce6;
    --muted: #6b7385;
    --off: #3a4256;
    --on: #38d178;
    --booting: #e8b23e;
    --danger: #d15252;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    padding: 2rem 1.5rem;
    text-align: center;
  }
  h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .08em;
       text-transform: uppercase; color: var(--muted); }

  /* the power button: a big ring that carries the state color */
  #power {
    width: 11rem; height: 11rem;
    border-radius: 50%;
    border: 5px solid var(--off);
    background: var(--panel);
    color: var(--text);
    font: inherit; font-size: 1.05rem; font-weight: 600;
    cursor: pointer;
    transition: border-color .3s, box-shadow .3s;
    -webkit-tap-highlight-color: transparent;
  }
  #power:disabled { opacity: .45; cursor: default; }
  #power.off     { border-color: var(--off); }
  #power.booting { border-color: var(--booting);
                   box-shadow: 0 0 2.5rem color-mix(in srgb, var(--booting) 35%, transparent); }
  #power.on      { border-color: var(--on);
                   box-shadow: 0 0 2.5rem color-mix(in srgb, var(--on) 35%, transparent); }
  /* a pending connect breathes so it doesn't read as dead */
  #power.wait .sym { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }
  /* power symbol drawn in CSS so there's no icon dependency */
  #power .sym {
    display: block; width: 2.2rem; height: 2.2rem; margin: 0 auto .6rem;
    border: 3px solid currentColor; border-radius: 50%;
    position: relative;
    -webkit-mask: conic-gradient(from -35deg, transparent 70deg, #000 0);
            mask: conic-gradient(from -35deg, transparent 70deg, #000 0);
  }
  #power .sym::after {
    content: ""; position: absolute; left: 50%; top: -0.9rem;
    transform: translateX(-50%);
    width: 3px; height: 1.4rem; background: currentColor; border-radius: 2px;
  }

  /* errors only — empty (and invisible) the rest of the time */
  #state { font-size: .9rem; color: var(--danger); min-height: 1.5em; max-width: 26rem; }
  #state.hint { color: var(--muted); } /* capability notes, not failures */

  .row { display: flex; gap: .75rem; flex-wrap: wrap; justify-content: center; }
  button.minor, input, select {
    background: var(--panel); color: var(--text);
    border: 1px solid #232a3d; border-radius: .5rem;
    padding: .55rem 1rem; font: inherit; font-size: .9rem;
  }
  button.minor { cursor: pointer; }
  button.minor:disabled { opacity: .45; cursor: default; }
  button.minor.danger { color: var(--danger); }
  input { width: 13rem; text-align: center; letter-spacing: .05em; }

  /* which receiver: hidden until a board has been granted at least once */
  #picker { min-width: 13rem; text-align: center; cursor: pointer; }
  #picker:disabled { opacity: .45; cursor: default; }

  #tokenbox { display: none; flex-direction: column; gap: .75rem; align-items: center; }
  #tokenbox.show { display: flex; }
  #tokenbox p { font-size: .85rem; color: var(--muted); }

  /* ---- the dashboard: left-aligned cards under the ring ---- */
  #dash { display: none; width: 100%; max-width: 30rem; text-align: left;
          flex-direction: column; gap: .75rem; }
  #dash.show { display: flex; }
  .card { background: var(--panel); border: 1px solid #232a3d; border-radius: .75rem;
          padding: .8rem .9rem; }
  .card h2 { font-size: .75rem; font-weight: 600; letter-spacing: .08em;
             text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
  .card h2 .r { float: right; font-weight: 400; letter-spacing: 0; text-transform: none; }
  .note { font-size: .85rem; color: var(--muted); }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
  .tile { background: var(--bg); border-radius: .6rem; padding: .55rem .6rem; }
  .tile .k { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .tile .v { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .v small { font-size: .75rem; font-weight: 400; color: var(--muted); margin-left: .15rem; }

  /* one card per fan header */
  .fan { display: grid; grid-template-columns: 1fr auto; gap: .2rem .75rem; align-items: baseline; }
  .fan .name { font-weight: 600; }
  .fan .duty { font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .fan .duty small { font-size: .8rem; font-weight: 400; color: var(--muted); }
  .fan .sub { grid-column: 1 / -1; display: flex; gap: .5rem; align-items: center;
              font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
  .chip { border-radius: 999px; padding: .05rem .55rem; font-size: .72rem; font-weight: 600;
          background: var(--off); color: var(--text); }
  .chip.live { background: color-mix(in srgb, var(--on) 25%, var(--panel)); color: var(--on); }
  .chip.boost { background: color-mix(in srgb, var(--booting) 25%, var(--panel)); color: var(--booting); }
  .chip.hold { background: color-mix(in srgb, var(--danger) 25%, var(--panel)); color: var(--danger); }
  .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--off); overflow: hidden; margin: .3rem 0 .45rem; }
  .bar i { display: block; height: 100%; background: var(--on); transition: width .4s; }
  .bar.boost i { background: var(--booting); }
  .bar.fallback i { background: var(--muted); }

  /* the curve: an SVG the card owns; points drag when editing */
  .curve { grid-column: 1 / -1; width: 100%; height: 7.5rem; display: block;
           touch-action: none; user-select: none; -webkit-user-select: none; }
  .curve .grid { stroke: #232a3d; stroke-width: 1; }
  .curve .axis { fill: var(--muted); font-size: 9px; }
  .curve .line { fill: none; stroke: var(--on); stroke-width: 2; stroke-linejoin: round; }
  .curve.editing .line { stroke: var(--booting); }
  .curve .pt { fill: var(--panel); stroke: var(--on); stroke-width: 2; }
  .curve.editing .pt { stroke: var(--booting); r: 7; cursor: grab; }
  .curve .now { stroke: var(--text); stroke-width: 1; stroke-dasharray: 3 3; }
  .curve .nowpt { fill: var(--text); }

  .fan .tools { grid-column: 1 / -1; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-top: .3rem; }
  .fan .tools button, .gl .tools button { padding: .35rem .8rem; font-size: .82rem; }
  .fan .tools .msg { font-size: .8rem; color: var(--muted); }
  .fan .tools .msg.ok { color: var(--on); }
  .fan .tools .msg.err { color: var(--danger); }

  /* the editor: point rows and the two standalone fields */
  .editor { grid-column: 1 / -1; display: flex; flex-direction: column; gap: .4rem; margin-top: .2rem; }
  .editor .row { justify-content: flex-start; gap: .4rem; align-items: center; }
  .editor label { font-size: .78rem; color: var(--muted); min-width: 4.5rem; }
  .editor input { width: 4.6rem; padding: .35rem .4rem; text-align: right; letter-spacing: 0; font-size: .9rem; }
  .editor input:invalid { border-color: var(--danger); }
  .editor .x { cursor: pointer; padding: .2rem .55rem; font-size: .9rem; line-height: 1; }
  .editor .unit { font-size: .78rem; color: var(--muted); }

  .gl .fields { display: grid; grid-template-columns: auto 1fr; gap: .4rem .75rem; align-items: center; font-size: .9rem; }
  .gl .fields span { color: var(--muted); font-size: .85rem; }
  .gl .fields input { width: 5.5rem; text-align: right; letter-spacing: 0; padding: .3rem .4rem; }
  .gl .tools { display: flex; gap: .5rem; align-items: center; margin-top: .6rem; flex-wrap: wrap; }

  .info { display: grid; grid-template-columns: auto 1fr; gap: .25rem .75rem; font-size: .85rem; }
  .info span:nth-child(odd) { color: var(--muted); }
</style>
</head>
<body>
<h1>BC-250</h1>

<select id="picker" aria-label="Receiver" hidden></select>

<button id="power" class="off" disabled>
  <span class="sym"></span><span id="powerlabel">Connect</span>
</button>

<div id="state"></div>

<div class="row">
  <button id="shutdown" class="minor danger" hidden>Shut down</button>
  <button id="hardoff" class="minor danger" hidden>Force off</button>
  <button id="changetoken" class="minor" hidden>Change token</button>
  <button id="forget" class="minor" hidden>Forget receiver</button>
</div>

<div id="tokenbox">
  <p id="tokenfor">Receiver token</p>
  <input id="token" type="password" autocomplete="off"
         placeholder="token" maxlength="16">
  <div class="row">
    <button id="savetoken" class="minor">Save</button>
    <button id="canceltoken" class="minor" hidden>Cancel</button>
  </div>
</div>

<!-- the dashboard; filled by renderDash() once the receiver's fans
     characteristics are open -->
<section id="dash" aria-label="Dashboard">
  <div class="card" id="hostcard">
    <h2>Host <span class="r" id="hostnote"></span></h2>
    <div class="tiles">
      <div class="tile"><div class="k">CPU temp</div><div class="v" id="t-temp">—</div></div>
      <div class="tile"><div class="k">CPU load</div><div class="v" id="t-cpu">—</div></div>
      <div class="tile"><div class="k">GPU load</div><div class="v" id="t-gpu">—</div></div>
    </div>
  </div>
  <div id="fancards"></div>
  <div class="card gl" id="globals" hidden>
    <h2>Fan behaviour</h2>
    <div class="fields">
      <span>Hysteresis</span><div><input id="g-hyst" type="number" min="0" max="50" step="0.5"> <span class="unit">°C before slowing</span></div>
      <span>Ramp down</span><div><input id="g-ramp" type="number" min="0" max="100" step="0.5"> <span class="unit">%/s (0 = instant)</span></div>
      <span>Boost</span><div><input id="g-boost" type="number" min="0" max="255" step="1"> <span class="unit">s after power-on</span></div>
    </div>
    <div class="tools">
      <button class="minor" id="g-save">Save</button>
      <button class="minor" id="g-revert">Revert</button>
      <span class="msg" id="g-msg"></span>
    </div>
  </div>
  <div class="card" id="infocard">
    <h2>Receiver</h2>
    <div class="info" id="info"></div>
  </div>
</section>

<script>
'use strict';

const SVC    = 'a5f20001-8f11-4e0e-9b3a-0bc250e0c001';
const CTRL   = 'a5f20002-8f11-4e0e-9b3a-0bc250e0c001';
const STAT   = 'a5f20003-8f11-4e0e-9b3a-0bc250e0c001';
const FANS   = 'a5f20004-8f11-4e0e-9b3a-0bc250e0c001';
const FANCFG = 'a5f20005-8f11-4e0e-9b3a-0bc250e0c001';
const INFO   = 'a5f20006-8f11-4e0e-9b3a-0bc250e0c001';
const TELEM  = 'a5f20007-8f11-4e0e-9b3a-0bc250e0c001';
const OP_ON = 0x01, OP_SHUTDOWN = 0x02, OP_HARD_OFF = 0x03;
const TOKEN_LEN = 16;
const STATE_NAMES = ['off', 'booting', 'on'];
const DEFAULT_NAME = 'BC250'; // what the firmware advertises without a ble_remote.name
const ADD = '+';              // picker value of the "add a receiver" entry

const $ = id => document.getElementById(id);
const powerBtn = $('power'), powerLabel = $('powerlabel');
const stateEl = $('state'), shutdownBtn = $('shutdown');
const hardoffBtn = $('hardoff'), tokenBtn = $('changetoken');
const forgetBtn = $('forget'), picker = $('picker');

let device = null, ctrl = null, stat = null; // the selected receiver + its live GATT
let fansChr = null, cfgChr = null, telemChr = null; // the dashboard's (null on older firmware)
let psu = -1;          // last status byte seen, -1 = unknown
let busy = false;      // a user-initiated connect or write in flight
let attempt = null;    // the device an auto-reconnect (watch or connect) is live for
let retryTimer = 0;
let watchAbort = null; // aborts the advertisement watch of the live attempt
let editToken = false; // the token box is open on request (change / rejected)

// ---- storage (localStorage; wrapped — storage can throw in private windows) ----
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// Every receiver the chooser has ever granted, by BluetoothDevice.id:
// { name, token }. The name caches what the board advertised so the list
// renders before (or without) getDevices(); the token is per board because
// each is flashed with its own ble_remote.token — a board without one of its own
// uses the shared 'ble-token', the first token ever entered on this phone.
const receivers = (() => {
  try { return JSON.parse(store.get('ble-receivers')) || {}; } catch { return {}; }
})();
const saveReceivers = () => store.set('ble-receivers', JSON.stringify(receivers));
// devices Chrome has handed out this session (getDevices / chooser), by id —
// only these can be connected without going through the chooser again
const known = new Map();

// earlier versions of this page knew exactly one receiver
if (store.get('ble-device')) {
  receivers[store.get('ble-device')] ||= { name: '', token: '' };
  store.set('ble-current', store.get('ble-device'));
  store.set('ble-device', '');
  saveReceivers();
}

const token = () => (device && receivers[device.id]?.token) || store.get('ble-token');
const anyKnown = () => Object.keys(receivers).length > 0;

function tokenBytes() {
  const bytes = new Uint8Array(TOKEN_LEN); // NUL padding, as the firmware compares
  const t = token();
  for (let i = 0; i < Math.min(t.length, TOKEN_LEN); i++)
    bytes[i] = t.charCodeAt(i);
  return bytes;
}

function remember(d) {
  const r = receivers[d.id] ||= { name: '', token: '' };
  if (d.name) r.name = d.name;
  known.set(d.id, d);
  saveReceivers();
}

// ---- UI ----
function say(html, hint) { stateEl.innerHTML = html; stateEl.classList.toggle('hint', !!hint); }

// display names, with twins (two boards both flashed as "BC250") numbered
let labels = {};
function relabel() {
  const ids = Object.keys(receivers).sort((a, b) =>
    (receivers[a].name || DEFAULT_NAME).localeCompare(receivers[b].name || DEFAULT_NAME) ||
    a.localeCompare(b));
  const seen = {};
  labels = {};
  for (const id of ids) {
    const base = receivers[id].name || DEFAULT_NAME;
    const n = seen[base] = (seen[base] || 0) + 1;
    labels[id] = n > 1 ? `${base} (${n})` : base;
  }
  return ids;
}
const label = id => labels[id] || receivers[id]?.name || DEFAULT_NAME;

function renderPicker() {
  const ids = relabel();
  picker.hidden = !anyKnown();
  const current = device?.id || store.get('ble-current');
  const items = ids.map(id => [id, labels[id]]);
  if (!ids.includes(current)) items.unshift(['', 'Receiver…']);
  items.push([ADD, 'Add a receiver…']);
  // rebuilding a <select> the user has open closes it — only when it changed
  const sig = JSON.stringify(items) + '|' + current;
  if (sig !== picker.dataset.sig) {
    picker.dataset.sig = sig;
    picker.replaceChildren(...items.map(([v, t]) => {
      const o = new Option(t, v);
      if (v === '') o.disabled = true;
      return o;
    }));
    picker.value = ids.includes(current) ? current : '';
  }
  picker.disabled = busy;
}

function render() {
  renderPicker();
  if (!('bluetooth' in navigator)) { powerBtn.disabled = true; picker.hidden = true; return; }
  const connected = !!(device && device.gatt.connected);
  $('dash').classList.toggle('show', connected && !!fansChr);
  const pending = !!device && attempt === device;
  powerBtn.className = (STATE_NAMES[psu] || 'off') +
                       (!connected && (pending || busy) ? ' wait' : '');
  // graceful shutdown needs a running OS to ask; the hard cut only needs the
  // PSU to be up — it's the crash rescue, so it shows while booting too
  shutdownBtn.hidden = !(connected && psu === 2);
  hardoffBtn.hidden = !(connected && psu >= 1);
  tokenBtn.hidden = !token() || editToken;
  forgetBtn.hidden = !device || busy;

  const box = $('tokenbox');
  box.classList.toggle('show', editToken || !token());
  $('tokenfor').textContent = device
    ? `Token for ${label(device.id)}` : 'Receiver token';
  $('canceltoken').hidden = !token();
  if (!token()) {
    powerBtn.disabled = true;
    powerLabel.textContent = 'Connect';
    return;
  }

  if (!connected) {
    // still tappable while an auto-reconnect pends — the tap opens the
    // chooser, the manual escape hatch (new receiver, permission revoked)
    powerBtn.disabled = busy;
    powerLabel.textContent = busy || pending ? 'Connecting…' : 'Connect';
  } else if (psu === 0) {
    powerBtn.disabled = busy;
    powerLabel.textContent = 'Power on';
  } else {
    powerBtn.disabled = true;
    powerLabel.textContent = psu === 1 ? 'Booting…' : 'On';
  }
}

// ---- BLE ----
// top-level named handlers: addEventListener dedupes identical refs, so
// re-attaching across reconnects can't stack them
const onStatusEvent = e => { if (e.target === stat) onStatus(e.target.value.getUint8(0)); };

// make d the selected receiver: the live connection (if any) moves with it
function attach(d) {
  watchAbort?.abort(); // a pick/switch supersedes any pending auto-attempt
  if (device && device !== d && device.gatt.connected) device.gatt.disconnect();
  device = d;
  ctrl = stat = null;
  psu = -1;
  editToken = false;
  dashReset();
  store.set('ble-current', d.id);
  d.addEventListener('gattserverdisconnected', onDisconnected);
}

async function open() {
  const d = device;
  const gatt = await d.gatt.connect();
  const svc = await gatt.getPrimaryService(SVC);
  const c = await svc.getCharacteristic(CTRL);
  const s = await svc.getCharacteristic(STAT);
  await s.startNotifications();
  const first = (await s.readValue()).getUint8(0);
  if (device !== d) { gatt.disconnect(); return; } // superseded while we were at it
  ctrl = c; stat = s;
  s.addEventListener('characteristicvaluechanged', onStatusEvent);
  onStatus(first);
  remember(d);
  say('');
  dashOpen(svc).catch(e => { dashNote(`Dashboard: ${e.message}`); });
}

function onStatus(v) {
  psu = v;
  render();
}

function onDisconnected(e) {
  if (e.target !== device) return; // a stale device we already replaced
  ctrl = stat = null;
  psu = -1;
  dashReset();
  render();
  scheduleReconnect(1000);
}

// Chrome won't gatt.connect() a getDevices() device it hasn't discovered
// this session: watch its advertisements and connect on the first one seen.
// Resolves 'seen' (in range, connect now), 'fallback' (watch API missing or
// refused — attempt a blind connect, the pre-flag behavior), or 'aborted'
// (superseded by a pick / switch / tab hidden — do nothing).
function waitForAdvertisement(d) {
  if (!d.watchAdvertisements) return Promise.resolve('fallback');
  return new Promise(resolve => {
    watchAbort?.abort();
    const ac = watchAbort = new AbortController();
    ac.signal.addEventListener('abort', () => resolve('aborted'));
    d.addEventListener('advertisementreceived',
                       () => { resolve('seen'); ac.abort(); },
                       { once: true, signal: ac.signal });
    d.watchAdvertisements({ signal: ac.signal })
      .catch(() => { resolve('fallback'); ac.abort(); });
  });
}

// auto-reconnect: the advertisement watch pends until the receiver is in
// range, so one live attempt is the whole loop; the retry timer only guards
// against failures after that (connect lost the race, Bluetooth off). The
// attempt is pinned to a device: switching boards while one pends lets the
// stale attempt fall through and starts a fresh one for the new board.
async function reconnect() {
  if (!device || device.gatt.connected || attempt === device || busy) return;
  const d = attempt = device;
  render();
  try {
    const how = await waitForAdvertisement(d);
    if (how === 'aborted' || device !== d || d.gatt.connected) return;
    await open();
  }
  catch (e) {
    if (device !== d) return; // died because we switched away — not news
    // keep retrying, but say why the last attempt died instead of idling mute
    say(`Auto-reconnect: ${e.message} — retrying.`, true);
    scheduleReconnect(10000);
  }
  finally { if (attempt === d) attempt = null; render(); }
}

function scheduleReconnect(ms) {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(reconnect, ms);
}

// on load (and when the tab returns — Chrome drops pending connects in the
// background), pick up the boards the chooser permitted before and connect
// to the one used last
async function resume() {
  if (device) { reconnect(); return; }
  if (!token() || !('bluetooth' in navigator)) return;
  if (!navigator.bluetooth.getDevices) {
    // stock Chrome (2026): persistent-device APIs still flag-gated
    say('Auto-reconnect needs “Experimental Web Platform features” turned ' +
        'on in <code>chrome://flags</code> — until then, tap to connect.', true);
    return;
  }
  try {
    const list = await navigator.bluetooth.getDevices();
    for (const d of list) remember(d);
    const d = list.find(x => x.id === store.get('ble-current')) || list[0];
    if (!d) {
      // we HAVE connected before (receivers are stored) yet Chrome
      // remembers nothing. One tap re-grants it; whether THAT grant then
      // survives the session is the second flag's doing — the page can't
      // read flag state, so name it only as the reason this would recur
      if (anyKnown())
        say('Chrome holds no permission for the receiver — tap to connect ' +
            'once. If this keeps coming back, enable <code>chrome://flags/' +
            '#enable-web-bluetooth-new-permissions-backend</code> and ' +
            'relaunch Chrome.', true);
      render();
      return;
    }
    attach(d);
    reconnect();
  } catch (e) { say(`Auto-reconnect failed: ${e.message}`); }
}

// the chooser: grants (and thereby adds) a receiver, then connects to it
async function pick() {
  const d = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
  remember(d);
  if (device && device.id === d.id && device.gatt.connected) {
    store.set('ble-current', d.id);
    return; // picked the board we're already on
  }
  attach(d);
  render();
  await open();
}

// the dropdown: a board Chrome handed us this session connects directly
// (through the advertisement dance); anything else needs the chooser
function select(id) {
  store.set('ble-current', id);
  if (device?.id === id) { reconnect(); return; }
  attach(known.get(id));
  say('');
  reconnect();
}

async function write(op) {
  const buf = new Uint8Array(TOKEN_LEN + 1);
  buf.set(tokenBytes());
  buf[TOKEN_LEN] = op;
  try {
    await ctrl.writeValueWithResponse(buf);
    say('');
  } catch (e) {
    // NimBLE answers a wrong token with "insufficient authentication"
    if (/auth|not permitted|gatt/i.test(e.message)) {
      say(`Token rejected by ${label(device.id)} — enter the one it was flashed with.`);
      editToken = true;
    } else {
      say(`Write failed: ${e.message}`);
    }
    throw e;
  }
}

// ---- the dashboard ----
// Four values off the receiver: `fans` (its own live view, binary, notified
// once a second), `cfg` and `telem` (the daemon's config and readings, JSON
// text relayed verbatim — daemon/fans.hpp documents the shape; notified when
// the daemon sends a new one) and `info` (build facts, read once). The page
// keeps the last of each and redraws from them; editing works on a copy of
// one header (or the globals) and sends back just that as a partial edit.

const KIND = { constant: 0, temp: 1, pwm: 2, cpu_load: 3, gpu_load: 4 }; // cfg's "s"
const KINDS = ['fixed', 'temperature', 'board pwm', 'CPU load', 'GPU load'];
const KIND_LABEL = ['', '', 'board pwm ', 'CPU ', 'GPU ']; // before a reading
const KIND_CONST = 0, KIND_TEMP = 1;
const NONE = 0xFF;
const CHANNELS = 6, MAX_POINTS = 8;   // the page adds no more than this; the daemon has no cap
const SRC_NAMES = ['', 'fallback', 'live', 'boost']; // fan::SRC_*
const FANS_LEN = 4 + CHANNELS * 2 + 4;
const SAVE_TIMEOUT_MS = 6000;
const utf8 = new TextDecoder();

let fans = null, cfg = null, telem = null, info = null;
let edits = {};       // header slot (or 'g') -> working copy while being edited
let saving = null;    // 'g' or a slot: a write waiting for the daemon's config to come back
let saveTimer = 0;
let dragging = null;  // { slot, idx } while a curve point is being dragged

const u32 = (dv, o) => dv.getUint32(o, true);

function parseFans(dv) {
  if (dv.byteLength < FANS_LEN || dv.getUint8(0) !== 1) return null;
  const f = dv.getUint8(1);
  const out = {
    active: !!(f & 1), boosting: !!(f & 2), hold: !!(f & 4), live: !!(f & 8),
    host: !!(f & 16), telem: !!(f & 32),
    psu: dv.getUint8(2), age: dv.getUint8(3), h: [], uptime: u32(dv, 4 + CHANNELS * 2),
  };
  for (let i = 0; i < CHANNELS; i++) {
    const st = dv.getUint8(4 + i * 2);
    out.h.push({ wired: !!(st & 1), src: (st >> 1) & 3, duty: dv.getUint8(5 + i * 2) });
  }
  return out;
}

// "45:35 60:55" (or "65" for a constant) -> [{x, y}], sorted; the daemon's notation
function parseCurve(text, constant) {
  const toks = String(text).trim().split(/[\s,]+/).filter(Boolean);
  if (constant) return [{ x: 0, y: parseFloat(toks[0]) || 0 }];
  return toks.map(t => { const [x, y] = t.split(':').map(parseFloat); return { x, y }; })
             .filter(p => !isNaN(p.x) && !isNaN(p.y)).sort((a, b) => a.x - b.x);
}
const curveText = (pts, constant) => constant ? String(pts[0].y) : pts.map(p => `${p.x}:${p.y}`).join(' ');

// the daemon's config JSON -> { editable, hyst, ramp, boostSecs, h[slot] }
function parseCfg(text) {
  let j;
  try { j = JSON.parse(text); } catch { return null; }
  if (!j || typeof j !== 'object') return null;
  const c = { editable: !!j.editable, hyst: +j.hysteresis || 0, ramp: +j.ramp || 0,
              boostSecs: +j.boost_seconds || 0, h: [] };
  for (let i = 0; i < CHANNELS; i++) {
    const h = j['header' + (i + 1)];
    if (!h) { c.h.push(null); continue; }
    const kind = KIND[h.s] ?? KIND_CONST;
    c.h.push({ name: String(h.n || ''), kind, pts: parseCurve(h.c, kind === KIND_CONST),
               boost: h.b === null || h.b === undefined ? NONE : +h.b, fallback: +h.f });
  }
  return c;
}

// the daemon's telemetry JSON -> { temp, cpu, gpu, h[slot]: { in, duty } }
function parseTelem(text) {
  let j;
  try { j = JSON.parse(text); } catch { return null; }
  if (!j || typeof j !== 'object') return null;
  const t = { temp: j.temp, cpu: j.cpu, gpu: j.gpu, h: [] };
  for (let i = 0; i < CHANNELS; i++) t.h.push(j['header' + (i + 1)] || null);
  return t;
}

function parseInfo(dv) {
  if (dv.byteLength < 41 || dv.getUint8(0) !== 1) return null;
  let v = '';
  for (let k = 1; k < 33; k++) { const ch = dv.getUint8(k); if (!ch) break; v += String.fromCharCode(ch); }
  return { version: v, heap: u32(dv, 33), minHeap: u32(dv, 37) };
}

function dashReset() {
  fansChr = cfgChr = telemChr = null;
  fans = cfg = telem = info = null;
  edits = {}; saving = null; dragging = null;
  clearTimeout(saveTimer);
  $('dash').classList.remove('show');
}

function dashNote(text) { $('hostnote').textContent = text; }

// a notification is truncated to the ATT MTU; a read isn't. The fans value
// fits any MTU, the two JSON values may not — so those are always re-read.
const onFansEvent = e => {
  if (e.target !== fansChr) return;
  const f = parseFans(e.target.value);
  if (f) { fans = f; renderDash(); }
};
const onCfgEvent = async e => {
  if (e.target !== cfgChr) return;
  try { onCfg(await cfgChr.readValue()); } catch {}
};
const onTelemEvent = async e => {
  if (e.target !== telemChr) return;
  try { telem = parseTelem(utf8.decode(await telemChr.readValue())); renderDash(); } catch {}
};

function onCfg(dv) {
  cfg = dv.byteLength ? parseCfg(utf8.decode(dv)) : null;
  if (saving !== null) {
    // the daemon answered a save with its new config: that card is done
    const key = saving;
    saving = null;
    clearTimeout(saveTimer);
    delete edits[key];
    flash(key, 'saved', 'ok');
  }
  renderDash();
}

async function dashOpen(svc) {
  let f, c, t, i;
  try {
    f = await svc.getCharacteristic(FANS);
    c = await svc.getCharacteristic(FANCFG);
    t = await svc.getCharacteristic(TELEM);
  } catch { return; } // older firmware: no dashboard, and nothing to say
  try { i = await svc.getCharacteristic(INFO); } catch { i = null; }
  if (!device || !device.gatt.connected) return;
  fansChr = f; cfgChr = c; telemChr = t;
  f.addEventListener('characteristicvaluechanged', onFansEvent);
  c.addEventListener('characteristicvaluechanged', onCfgEvent);
  t.addEventListener('characteristicvaluechanged', onTelemEvent);
  await f.startNotifications();
  await c.startNotifications();
  await t.startNotifications(); // this one tells the daemon to start reporting
  const fv = parseFans(await f.readValue());
  if (fv) fans = fv;
  onCfg(await c.readValue());
  const tv = await t.readValue();
  telem = tv.byteLength ? parseTelem(utf8.decode(tv)) : null;
  if (i) { try { info = parseInfo(await i.readValue()); } catch { info = null; } }
  renderDash();
}

// ---- rendering ----
const fmt1 = v => (Math.round(v * 10) / 10).toString();
const fmtIn = (kind, v) => kind === KIND_TEMP ? `${fmt1(v)} °C` : `${fmt1(v)} %`;
const fmtUptime = s => s < 3600 ? `${Math.floor(s / 60)} min` :
  s < 86400 ? `${Math.floor(s / 3600)} h ${Math.floor(s % 3600 / 60)} min` :
  `${Math.floor(s / 86400)} d ${Math.floor(s % 86400 / 3600)} h`;

function flash(key, text, cls) {
  const el = key === 'g' ? $('g-msg') : document.querySelector(`.fan[data-slot="${key}"] .msg`);
  if (!el) return;
  el.textContent = text;
  el.className = 'msg ' + (cls || '');
  if (cls === 'ok') setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 2500);
}

function renderDash() {
  const show = !!(fansChr && device && device.gatt.connected);
  $('dash').classList.toggle('show', show);
  if (!show) return;

  // host tiles: only while the receiver says the daemon's telemetry is fresh
  const t = fans && fans.telem && telem;
  $('t-temp').innerHTML = t && telem.temp !== undefined ? `${fmt1(telem.temp)}<small>°C</small>` : '—';
  $('t-cpu').innerHTML = t && telem.cpu !== undefined ? `${telem.cpu}<small>%</small>` : '—';
  $('t-gpu').innerHTML = t && telem.gpu !== undefined ? `${telem.gpu}<small>%</small>` : '—';
  if (!fans) dashNote('');
  else if (fans.telem) dashNote(`daemon live · ${fans.age}s ago`);
  else if (fans.psu !== 2) dashNote('machine off');
  else if (!fans.host) dashNote('no host on the link');
  else dashNote(fans.age === 255 ? 'daemon not reporting' : `daemon quiet ${fans.age}s`);

  renderFans();
  renderGlobals();

  const rows = [];
  if (info) {
    rows.push(['Firmware', info.version || '?']);
    rows.push(['Free heap', `${Math.round(info.heap / 1024)} KB (min ${Math.round(info.minHeap / 1024)} KB)`]);
  }
  if (fans) {
    rows.push(['Uptime', fmtUptime(fans.uptime)]);
    rows.push(['Fan headers', fans.active ? `${fans.h.filter(h => h.wired).length} wired` : 'off (no fancfg)']);
    rows.push(['Host link', fans.host ? 'present' : 'absent']);
  }
  $('info').replaceChildren(...rows.flatMap(([k, v]) => {
    const a = document.createElement('span'), b = document.createElement('span');
    a.textContent = k; b.textContent = v; return [a, b];
  }));
}

// which headers get a card: every wired one (the receiver drives it) plus
// any the daemon's config has (it lists enabled headers only), so a header
// enabled in the config but not flashed still shows — with a note, since
// that is a real misconfiguration
function cardSlots() {
  const slots = new Set();
  if (fans) fans.h.forEach((h, i) => { if (h.wired) slots.add(i); });
  if (cfg) cfg.h.forEach((h, i) => { if (h) slots.add(i); });
  return [...slots].sort((a, b) => a - b);
}

function renderFans() {
  const wrap = $('fancards');
  const slots = cardSlots();
  // keep cards across redraws so an open editor (and a drag) survives
  const have = new Map([...wrap.children].map(el => [+el.dataset.slot, el]));
  for (const el of have.values()) if (!slots.includes(+el.dataset.slot)) el.remove();
  let anyNote = false;
  for (const slot of slots) {
    let el = have.get(slot);
    if (!el) {
      el = document.createElement('div');
      el.className = 'card fan';
      el.dataset.slot = slot;
      wrap.appendChild(el);
    }
    anyNote |= renderFanCard(el, slot);
  }
  // order the cards by slot (a header appearing later lands in place)
  [...wrap.children].sort((a, b) => a.dataset.slot - b.dataset.slot).forEach(el => wrap.appendChild(el));
  if (!slots.length) {
    wrap.replaceChildren(Object.assign(document.createElement('div'), {
      className: 'card note',
      textContent: fans && !fans.active ? 'No fan headers wired on this receiver (the config’s fans block is off or unflashed).'
                                        : 'No fan configuration from the daemon yet.' }));
  }
}

// one header card. Returns true when it shows a misconfiguration note.
function renderFanCard(el, slot) {
  const f = fans && fans.h[slot];
  const c = cfg && cfg.h[slot];
  const tm = fans && fans.telem && telem && telem.h[slot];
  const editing = slot in edits;
  const work = editing ? edits[slot] : c;
  const kind = c ? c.kind : KIND_CONST;
  const name = (c && c.name) || `header${slot + 1}`;
  const editable = !!(cfg && cfg.editable) && !!c;

  let src = f && f.wired ? SRC_NAMES[f.src] : '';
  if (f && f.hold) src = 'hold';
  const duty = f && f.wired && f.duty !== NONE ? f.duty : null;

  let sub = '';
  if (c) {
    if (kind === KIND_CONST) sub = 'fixed speed';
    else if (tm && tm.in !== undefined) sub = `${KIND_LABEL[kind]}${fmtIn(kind, tm.in)}`;
    else sub = fans && fans.telem ? 'no reading' : `curve on ${KINDS[kind]}`;
  } else if (f && f.wired) sub = 'not driven by the daemon — runs its fallback';
  let note = '';
  if (c && f && !f.wired) note = 'enabled in the config but not wired on the receiver: run make flash-fan';

  // first paint builds the skeleton; later paints only update text/attrs so
  // an open editor's inputs (and the drag) aren't torn down under the finger
  if (!el.firstChild) {
    el.innerHTML = `
      <div class="name"></div><div class="duty"><span class="d"></span><small>%</small></div>
      <div class="sub"><span class="chip"></span><span class="what"></span><span class="note" hidden></span></div>
      <div class="bar"><i></i></div>
      <svg class="curve" viewBox="0 0 320 120" preserveAspectRatio="none"></svg>
      <div class="editor" hidden></div>
      <div class="tools"><button class="minor edit">Edit curve</button>
        <button class="minor save" hidden>Save</button><button class="minor cancel" hidden>Cancel</button>
        <span class="msg"></span></div>`;
    el.querySelector('.edit').addEventListener('click', () => beginEdit(slot));
    el.querySelector('.cancel').addEventListener('click', () => { delete edits[slot]; renderDash(); });
    el.querySelector('.save').addEventListener('click', () => saveEdit(slot));
    bindCurveDrag(el.querySelector('.curve'), slot);
  }

  el.querySelector('.name').textContent = name;
  el.querySelector('.d').textContent = duty === null ? '—' : duty;
  const chip = el.querySelector('.chip');
  chip.textContent = src;
  chip.className = 'chip ' + (src === 'live' ? 'live' : src === 'boost' ? 'boost' : src === 'hold' ? 'hold' : '');
  chip.hidden = !chip.textContent;
  el.querySelector('.what').textContent = sub;
  const noteEl = el.querySelector('.note');
  noteEl.textContent = note; noteEl.hidden = !note;
  const bar = el.querySelector('.bar');
  bar.className = 'bar ' + (src === 'boost' ? 'boost' : src === 'fallback' ? 'fallback' : '');
  bar.firstChild.style.width = `${duty === null ? 0 : duty}%`;

  const svg = el.querySelector('.curve');
  svg.hidden = !work || !work.pts.length;
  if (work && work.pts.length) drawCurve(svg, work, tm && tm.in !== undefined ? tm.in : null, editing);
  svg.classList.toggle('editing', editing);

  const ed = el.querySelector('.editor');
  ed.hidden = !editing;
  if (editing) renderEditor(ed, slot);
  el.querySelector('.edit').hidden = editing || !editable;
  el.querySelector('.save').hidden = !editing;
  el.querySelector('.cancel').hidden = !editing;
  el.querySelector('.save').disabled = saving !== null;
  return !!note;
}

// ---- the curve chart ----
// x spans the curve's points with a margin (percent kinds always 0..100), y
// is 0..100 duty; the polyline is flat beyond the end points, as the daemon
// evaluates it. `now` marks the current input on the curve.
const PAD = { l: 26, r: 8, t: 6, b: 16 }, W = 320, H = 120;

function xDomain(h) {
  if (h.kind !== KIND_TEMP) return [0, 100];
  const xs = h.pts.map(p => p.x);
  let lo = Math.min(20, ...xs) - 5, hi = Math.max(90, ...xs) + 5;
  lo = Math.floor(lo / 10) * 10; hi = Math.ceil(hi / 10) * 10;
  return [lo, hi];
}
const sx = (x, d) => PAD.l + (x - d[0]) / (d[1] - d[0]) * (W - PAD.l - PAD.r);
const sy = y => PAD.t + (1 - y / 100) * (H - PAD.t - PAD.b);
const ux = (px, d) => d[0] + (px - PAD.l) / (W - PAD.l - PAD.r) * (d[1] - d[0]);
const uy = py => (1 - (py - PAD.t) / (H - PAD.t - PAD.b)) * 100;

function evalCurve(h, x) {
  const p = h.pts;
  if (x <= p[0].x) return p[0].y;
  if (x >= p[p.length - 1].x) return p[p.length - 1].y;
  for (let i = 1; i < p.length; i++)
    if (x <= p[i].x) { const a = p[i - 1], b = p[i]; return a.y + (x - a.x) / (b.x - a.x) * (b.y - a.y); }
  return p[p.length - 1].y;
}

function drawCurve(svg, h, now, editing) {
  const d = xDomain(h);
  const el = (tag, attrs, text) => {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  };
  const kids = [];
  for (const y of [0, 25, 50, 75, 100]) {
    kids.push(el('line', { class: 'grid', x1: PAD.l, x2: W - PAD.r, y1: sy(y), y2: sy(y) }));
    if (y % 50 === 0) kids.push(el('text', { class: 'axis', x: PAD.l - 4, y: sy(y) + 3, 'text-anchor': 'end' }, y));
  }
  const step = h.kind === KIND_TEMP ? 10 : 25;
  for (let x = d[0]; x <= d[1]; x += step)
    kids.push(el('text', { class: 'axis', x: sx(x, d), y: H - 4, 'text-anchor': 'middle' }, x));

  if (h.kind === KIND_CONST) {
    const y = sy(h.pts[0].y);
    kids.push(el('polyline', { class: 'line', points: `${PAD.l},${y} ${W - PAD.r},${y}` }));
    kids.push(el('circle', { class: 'pt', 'data-idx': 0, cx: (PAD.l + W - PAD.r) / 2, cy: y, r: 5 }));
  } else {
    const pts = h.pts.map(p => [sx(p.x, d), sy(p.y)]);
    const line = [[PAD.l, pts[0][1]], ...pts, [W - PAD.r, pts[pts.length - 1][1]]];
    kids.push(el('polyline', { class: 'line', points: line.map(p => p.join(',')).join(' ') }));
    if (now !== null && !editing) {
      const nx = Math.max(d[0], Math.min(d[1], now)), ny = evalCurve(h, now);
      kids.push(el('line', { class: 'now', x1: sx(nx, d), x2: sx(nx, d), y1: PAD.t, y2: H - PAD.b }));
      kids.push(el('circle', { class: 'nowpt', cx: sx(nx, d), cy: sy(ny), r: 3.5 }));
    }
    pts.forEach(([x, y], i) => kids.push(el('circle', { class: 'pt', 'data-idx': i, cx: x, cy: y, r: 5 })));
  }
  svg.replaceChildren(...kids);
}

// dragging a point while editing: x stays between its neighbours (and in the
// chart), y in 0..100; a constant only moves in y. Pointer events cover mouse
// and touch alike; the svg's touch-action: none keeps the page from scrolling.
function bindCurveDrag(svg, slot) {
  const pos = e => {
    const r = svg.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
  };
  svg.addEventListener('pointerdown', e => {
    if (!(slot in edits)) return;
    const t = e.target.closest('.pt');
    if (!t) return;
    dragging = { slot, idx: +t.dataset.idx };
    svg.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  svg.addEventListener('pointermove', e => {
    if (!dragging || dragging.slot !== slot) return;
    const h = edits[slot], p = h.pts[dragging.idx], d = xDomain(h);
    const [px, py] = pos(e);
    p.y = Math.round(Math.max(0, Math.min(100, uy(py))));
    if (h.kind !== KIND_CONST) {
      let x = ux(px, d);
      const lo = dragging.idx > 0 ? h.pts[dragging.idx - 1].x + 0.5 : d[0];
      const hi = dragging.idx < h.pts.length - 1 ? h.pts[dragging.idx + 1].x - 0.5 : d[1];
      x = Math.max(lo, Math.min(hi, x));
      p.x = h.kind === KIND_TEMP ? Math.round(x * 2) / 2 : Math.round(x);
    }
    renderDash();
  });
  const end = () => { if (dragging && dragging.slot === slot) { dragging = null; renderDash(); } };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
}

// ---- editing ----
function beginEdit(slot) {
  if (!cfg || !cfg.h[slot]) return;
  const h = cfg.h[slot];
  edits[slot] = { ...h, pts: h.pts.map(p => ({ ...p })) };
  renderDash();
}

// the numeric side of the editor: one row per point, add/remove, then boost
// and fallback. Rebuilt only when the point count changes, otherwise the
// inputs' values are refreshed in place (typing must not lose focus).
function renderEditor(ed, slot) {
  const h = edits[slot];
  const unit = h.kind === KIND_TEMP ? '°C' : '%';
  const rows = h.kind === KIND_CONST ? 1 : h.pts.length;
  if (+ed.dataset.rows !== rows || ed.dataset.kind !== String(h.kind)) {
    ed.dataset.rows = rows; ed.dataset.kind = h.kind;
    const parts = [];
    for (let i = 0; i < rows; i++) {
      parts.push(`<div class="row">
        ${h.kind === KIND_CONST ? '<label>duty</label>' :
          `<label>point ${i + 1}</label><input type="number" class="px" data-i="${i}" step="${h.kind === KIND_TEMP ? 0.5 : 1}"><span class="unit">${unit} →</span>`}
        <input type="number" class="py" data-i="${i}" min="0" max="100" step="1"><span class="unit">%</span>
        ${h.kind !== KIND_CONST && rows > 1 ? `<button class="minor x" data-i="${i}" title="remove point">×</button>` : ''}
      </div>`);
    }
    if (h.kind !== KIND_CONST && rows < MAX_POINTS)
      parts.push('<div class="row"><label></label><button class="minor add">+ point</button></div>');
    parts.push(`<div class="row"><label>boost</label><input type="number" class="boost" min="0" max="100" step="1" placeholder="none"><span class="unit">% at power-on, blank = none</span></div>`);
    parts.push(`<div class="row"><label>fallback</label><input type="number" class="fb" min="0" max="100" step="1"><span class="unit">% without the daemon</span></div>`);
    ed.innerHTML = parts.join('');
    ed.querySelectorAll('.px').forEach(inp => inp.addEventListener('input', () => {
      const v = parseFloat(inp.value); if (!isNaN(v)) h.pts[+inp.dataset.i].x = v; renderDash(); }));
    ed.querySelectorAll('.py').forEach(inp => inp.addEventListener('input', () => {
      const v = parseFloat(inp.value); if (!isNaN(v)) h.pts[+inp.dataset.i].y = Math.max(0, Math.min(100, v)); renderDash(); }));
    ed.querySelectorAll('.x').forEach(btn => btn.addEventListener('click', () => {
      h.pts.splice(+btn.dataset.i, 1); renderDash(); }));
    ed.querySelector('.add')?.addEventListener('click', () => {
      // a new point halfway along the widest gap (or past the end)
      const p = h.pts;
      let at = p.length, x, y;
      if (p.length === 1) { x = p[0].x + 10; y = Math.min(100, p[0].y + 10); }
      else {
        let best = 0;
        for (let i = 1; i < p.length; i++) if (p[i].x - p[i - 1].x > p[best + 1].x - p[best].x) best = i - 1;
        at = best + 1; x = (p[best].x + p[best + 1].x) / 2; y = Math.round((p[best].y + p[best + 1].y) / 2);
      }
      p.splice(at, 0, { x, y });
      renderDash();
    });
    ed.querySelector('.boost').addEventListener('input', e => {
      h.boost = e.target.value === '' ? NONE : Math.max(0, Math.min(100, Math.round(+e.target.value))); });
    ed.querySelector('.fb').addEventListener('input', e => {
      if (e.target.value !== '') h.fallback = Math.max(0, Math.min(100, Math.round(+e.target.value))); });
  }
  // refresh values without clobbering the field being typed in
  const set = (inp, v) => { if (document.activeElement !== inp && inp.value !== String(v)) inp.value = v; };
  ed.querySelectorAll('.px').forEach(inp => set(inp, h.pts[+inp.dataset.i].x));
  ed.querySelectorAll('.py').forEach(inp => set(inp, h.pts[+inp.dataset.i].y));
  set(ed.querySelector('.boost'), h.boost === NONE ? '' : h.boost);
  set(ed.querySelector('.fb'), h.fallback);
}

// what the daemon will refuse, said here first (it also validates)
function checkEdit(h) {
  if (!h.pts.length) return 'a curve needs at least one point';
  const xs = new Set();
  for (const p of h.pts) {
    if (!(p.y >= 0 && p.y <= 100)) return 'duty must be 0–100 %';
    if (h.kind !== KIND_CONST && xs.has(p.x)) return `two points at ${p.x}`;
    xs.add(p.x);
  }
  if (h.boost !== NONE && !(h.boost >= 0 && h.boost <= 100)) return 'boost must be 0–100 % or blank';
  if (!(h.fallback >= 0 && h.fallback <= 100)) return 'fallback must be 0–100 %';
  return '';
}

// write a partial edit (one header, or the globals — the daemon's JSON
// shape), then wait for the daemon's config to come back (onCfg) — that is
// what "saved" means here
async function writeCfg(key, edit) {
  if (!cfgChr || saving !== null) return;
  const text = new TextEncoder().encode(JSON.stringify(edit));
  const buf = new Uint8Array(TOKEN_LEN + text.length);
  buf.set(tokenBytes()); buf.set(text, TOKEN_LEN);
  saving = key;
  flash(key, 'saving…');
  renderDash();
  try {
    await cfgChr.writeValueWithResponse(buf);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      if (saving !== key) return;
      saving = null;
      flash(key, 'no answer from the daemon — is it running, and can it write its config?', 'err');
      renderDash();
    }, SAVE_TIMEOUT_MS);
  } catch (e) {
    saving = null;
    if (/auth|not permitted|gatt/i.test(e.message)) {
      flash(key, 'token rejected', 'err');
      editToken = true;
    } else flash(key, `write failed: ${e.message}`, 'err');
    renderDash();
  }
}

function saveEdit(slot) {
  const h = edits[slot];
  if (!h || !cfg) return;
  h.pts.sort((a, b) => a.x - b.x);
  const bad = checkEdit(h);
  if (bad) { flash(slot, bad, 'err'); return; }
  writeCfg(slot, { ['header' + (slot + 1)]: {
    c: curveText(h.pts, h.kind === KIND_CONST), b: h.boost === NONE ? null : h.boost, f: h.fallback } });
}

// ---- the global card: hysteresis, ramp, boost seconds ----
function renderGlobals() {
  const card = $('globals');
  const editable = !!(cfg && cfg.editable);
  card.hidden = !cfg;
  if (card.hidden) return;
  const g = edits.g || cfg;
  const set = (inp, v) => { if (document.activeElement !== inp && inp.value !== String(v)) inp.value = v; };
  set($('g-hyst'), g.hyst); set($('g-ramp'), g.ramp); set($('g-boost'), g.boostSecs);
  for (const id of ['g-hyst', 'g-ramp', 'g-boost']) $(id).disabled = !editable || saving !== null;
  $('g-save').hidden = $('g-revert').hidden = !('g' in edits);
  $('g-save').disabled = saving !== null;
}
for (const [id, key] of [['g-hyst', 'hyst'], ['g-ramp', 'ramp'], ['g-boost', 'boostSecs']])
  $(id).addEventListener('input', e => {
    if (!cfg) return;
    edits.g ||= { hyst: cfg.hyst, ramp: cfg.ramp, boostSecs: cfg.boostSecs };
    const v = parseFloat(e.target.value);
    if (!isNaN(v)) edits.g[key] = key === 'boostSecs' ? Math.max(0, Math.min(255, Math.round(v))) : Math.max(0, v);
    renderGlobals();
  });
$('g-revert').addEventListener('click', () => { delete edits.g; renderDash(); });
$('g-save').addEventListener('click', () => {
  if (!edits.g || !cfg) return;
  writeCfg('g', { hysteresis: edits.g.hyst, ramp: edits.g.ramp, boost_seconds: edits.g.boostSecs });
});

// ---- wiring ----
picker.addEventListener('change', async () => {
  const id = picker.value;
  if (busy) { picker.dataset.sig = ''; render(); return; } // never yank a board mid-write
  if (id !== ADD && known.has(id)) { select(id); render(); return; }
  busy = true; say(''); render();
  try { await pick(); }
  catch (e) {
    if (e.name !== 'NotFoundError') // chooser dismissed = not an error worth shouting
      say(`Couldn’t connect: ${e.message}`);
  } finally {
    busy = false;
    picker.dataset.sig = ''; // the selection may have gone nowhere: redraw
    render();
  }
});

powerBtn.addEventListener('click', async () => {
  if (busy) return;
  busy = true; say(''); render();
  if (device && device.gatt.connected) {
    if (psu === 0) try { await write(OP_ON); } catch {} // write() already said why
  } else {
    try { await pick(); }
    catch (e) {
      if (e.name !== 'NotFoundError') // chooser dismissed = not an error worth shouting
        say(`Couldn’t connect: ${e.message}`);
    }
  }
  busy = false; render();
});

shutdownBtn.addEventListener('click', async () => {
  if (busy || !confirm(`Ask ${label(device.id)} to shut down?`)) return;
  busy = true; render();
  try { await write(OP_SHUTDOWN); }
  catch {} finally { busy = false; render(); }
});

hardoffBtn.addEventListener('click', async () => {
  // the remote form of holding the physical button: an immediate PSU cut,
  // no graceful anything — for a crashed machine. Hence the louder confirm.
  if (busy || !confirm(`FORCE ${label(device.id)} off?\n\nThis cuts the PSU like ` +
                       'holding the button — unsaved work is lost. ' +
                       'For a machine that is wedged, not a normal shutdown.')) return;
  busy = true; render();
  try { await write(OP_HARD_OFF); }
  catch {} finally { busy = false; render(); }
});

$('savetoken').addEventListener('click', () => {
  const v = $('token').value.trim();
  if (v.length < 8) { say('The token is 8–16 characters.'); return; }
  // the selected board gets it; it also becomes the shared default when
  // there is none yet (first run) — the token boards without their own try
  if (device) { receivers[device.id].token = v; saveReceivers(); }
  if (!device || !store.get('ble-token')) store.set('ble-token', v);
  $('token').value = '';
  editToken = false;
  say('');
  render();
  resume();
});

$('canceltoken').addEventListener('click', () => {
  $('token').value = '';
  editToken = false;
  say('');
  render();
});

tokenBtn.addEventListener('click', () => { editToken = true; render(); });

forgetBtn.addEventListener('click', async () => {
  if (busy || !device) return;
  const d = device;
  if (!confirm(`Forget ${label(d.id)}?\n\nIts token and permission go; the chooser adds it back.`))
    return;
  clearTimeout(retryTimer);
  watchAbort?.abort();
  if (d.gatt.connected) d.gatt.disconnect();
  device = null; ctrl = stat = null; psu = -1; editToken = false;
  dashReset();
  delete receivers[d.id];
  known.delete(d.id);
  saveReceivers();
  if (store.get('ble-current') === d.id) store.set('ble-current', '');
  try { await d.forget?.(); } catch {} // Chrome ≥110 revokes the grant too
  say('');
  render();
  resume(); // falls over to the next known board, if any
});

document.addEventListener('visibilitychange', () => {
  // Chrome silently stops background scans: abort ours so the attempt
  // settles cleanly, and start a fresh one when the tab returns
  if (document.visibilityState === 'visible') resume();
  else watchAbort?.abort();
});

// ?demo: the dashboard on sample data, no receiver needed — to see the layout
// on a desktop, or to try the curve editor before wiring anything. Saves land
// locally after a moment, the way a daemon round trip would.
function demo() {
  cfg = parseCfg(JSON.stringify({ editable: true, hysteresis: 3, ramp: 5, boost_seconds: 5,
    header1: { n: 'pump', s: 'constant', c: '65', b: 100, f: 100 },
    header2: { n: 'radiator', s: 'temp', c: '45:35 60:55 75:100', b: null, f: 100 },
    header3: { n: 'exhaust', s: 'pwm', c: '0:25 100:80', b: null, f: 100 },
    header4: { n: 'intake', s: 'gpu_load', c: '0:20 40:20 100:60', b: null, f: 60 } }));
  telem = parseTelem(JSON.stringify({ temp: 58.3, cpu: 37, gpu: 62,
    header1: { duty: 65 }, header2: { in: 58.3, duty: 52 }, header3: { in: 65.4, duty: 61 }, header4: { in: 62, duty: 45 } }));
  const f = new Uint8Array(FANS_LEN), dv = new DataView(f.buffer);
  f[0] = 1; f[1] = 0x01 | 0x08 | 0x10 | 0x20; f[2] = 2; f[3] = 1;
  // state: wired | src<<1 (2 = live)
  [[0x05, 65], [0x05, 52], [0x05, 61], [0x05, 45], [0, NONE], [0, NONE]].forEach(([st, d], k) => { f[4 + k * 2] = st; f[5 + k * 2] = d; });
  dv.setUint32(4 + CHANNELS * 2, 5 * 3600 + 17 * 60, true);
  fans = parseFans(dv);
  info = { version: 'v1.20.0-demo', heap: 143 * 1024, minHeap: 121 * 1024 };
  psu = 2;
  // stand-ins for the GATT objects so the page believes it is connected
  device = { id: 'demo', gatt: { connected: true } };
  receivers.demo = { name: 'BC250 (demo)', token: 'demo-token' };
  fansChr = telemChr = {};
  cfgChr = { writeValueWithResponse: async buf => {
    // merge the partial edit the way the daemon would
    const edit = JSON.parse(utf8.decode(buf.subarray(TOKEN_LEN)));
    const cur = cfg, out = { editable: true, hysteresis: edit.hysteresis ?? cur.hyst, ramp: edit.ramp ?? cur.ramp,
                             boost_seconds: edit.boost_seconds ?? cur.boostSecs };
    cur.h.forEach((h, i) => { if (!h) return; const k = 'header' + (i + 1), e = edit[k] || {};
      out[k] = { n: h.name, s: Object.keys(KIND)[h.kind], c: e.c ?? curveText(h.pts, h.kind === KIND_CONST),
                 b: 'b' in e ? e.b : (h.boost === NONE ? null : h.boost), f: e.f ?? h.fallback }; });
    setTimeout(() => onCfg(new DataView(new TextEncoder().encode(JSON.stringify(out)).buffer)), 600); } };
  powerBtn.disabled = true;
  render();
  renderDash();
  if (location.search.includes('edit')) beginEdit(1);
  say('Demo data — not connected to a receiver.', true);
}

if (location.search.includes('demo'))
  demo();
else if (!('bluetooth' in navigator))
  say('No Web Bluetooth here — use Chrome or Edge (not on iOS).');
else
  resume();

if ('serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(() => {});

render();
</script>
