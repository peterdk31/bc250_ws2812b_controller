# Managed components pulled from the ESP Component Registry on first build
# (idf.py resolves these into firmware/managed_components/, gitignored).
#   led_strip  — RMT-backed WS2812 driver (replaces the Arduino Freenove lib)
#   littlefs   — LittleFS VFS for the recording store (replaces Arduino LittleFS)
dependencies:
  idf:
    version: ">=5.1"
  espressif/led_strip:
    version: "^2.5.5"
  joltwallet/littlefs:
    version: "^1.14.8"
