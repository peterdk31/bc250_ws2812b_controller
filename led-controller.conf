# kernel modules the daemon wants at boot, installed to /etc/modules-load.d by
# `make install`. i2c-dev exposes the I2C buses as /dev/i2c-N, which is how
# the daemon reaches the BC-250's VRM controller for the pmbus: temperature
# sources (README "VRM and GDDR6 temperatures"); no bus, no harm — the
# module is in every distro kernel and idle without a user.
i2c-dev
